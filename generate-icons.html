<!DOCTYPE html>
<html>
<head><title>Gerar ícones</title></head>
<body>
<p>Clique nos botões para baixar os ícones e salvar na pasta <code>icons/</code></p>
<canvas id="c"></canvas>
<br><br>
<button onclick="gen(192)">Baixar icon-192.png</button>
<button onclick="gen(512)">Baixar icon-512.png</button>
<script>
function gen(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  // bg
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0,0,size,size);
  // rounded rect
  const r = size * 0.22;
  ctx.beginPath();
  ctx.roundRect(size*0.15, size*0.15, size*0.7, size*0.7, r);
  ctx.fillStyle = '#1d4ed8';
  ctx.fill();
  // shield icon
  const s = size * 0.38;
  const ox = (size - s) / 2, oy = (size - s) / 2;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = size * 0.05;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(ox + s*0.5, oy + s*0.08);
  ctx.lineTo(ox + s*0.92, oy + s*0.25);
  ctx.lineTo(ox + s*0.92, oy + s*0.55);
  ctx.quadraticCurveTo(ox + s*0.92, oy + s*0.85, ox + s*0.5, oy + s*0.95);
  ctx.quadraticCurveTo(ox + s*0.08, oy + s*0.85, ox + s*0.08, oy + s*0.55);
  ctx.lineTo(ox + s*0.08, oy + s*0.25);
  ctx.closePath();
  ctx.stroke();
  // download
  const a = document.createElement('a');
  a.download = `icon-${size}.png`;
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
