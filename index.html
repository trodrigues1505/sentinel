<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerência de Enfermagem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GE Enfermagem">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="stylesheet" href="css/app.css">
<script src="canon.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>
<div id="root"></div>

<div id="ge-version" role="status" tabindex="0" title="Versão do app. Clique para procurar atualizações.">
  <span class="ge-pip"></span><span id="ge-version-label">—</span>
</div>

<div id="ge-update" role="alertdialog" aria-live="polite" aria-hidden="true">
  <div class="ge-txt">
    <b>Nova versão disponível</b>
    <span>Atualize para continuar com os dados e recursos mais recentes. A página vai recarregar.</span>
  </div>
  <div class="ge-acts">
    <button class="ge-now" id="ge-update-now">Atualizar</button>
    <button class="ge-later" id="ge-update-later">Depois</button>
  </div>
</div>

<script>
(function () {
  // ==========================================================================
  // ATUALIZAÇÃO — REGRA ÚNICA
  // version.json é a ÚNICA fonte de verdade. Bump nele a cada deploy.
  // Qualquer mudança (index.html, sw.js, canon.js, manifest) é anunciada pelo
  // mesmo toast e aplicada pelo mesmo botão. F5 nunca é necessário.
  // ==========================================================================
  var APP_VERSION = '2026.09.21-1';   // deve bater com version.json

  var pill  = document.getElementById('ge-version');
  var label = document.getElementById('ge-version-label');
  var toast = document.getElementById('ge-update');
  var novaVersao = null;
  var aplicando = false;

  label.textContent = 'v' + APP_VERSION;
  pill.dataset.state = 'idle';

  function anunciar(v) {
    if (aplicando) return;
    novaVersao = v || null;
    pill.dataset.state = 'stale';
    label.textContent = 'v' + APP_VERSION + ' · atualização';
    toast.classList.add('show');
    toast.setAttribute('aria-hidden', 'false');
  }

  // Aplica TUDO de uma vez: ativa o SW em espera, limpa caches e recarrega.
  // Não importa se mudou o index, o sw ou um asset — o caminho é um só.
  async function aplicar() {
    aplicando = true;
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          await new Promise(function (res) {
            var t = setTimeout(res, 1500);
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              clearTimeout(t); res();
            }, { once: true });
          });
        }
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
    } catch (e) { console.error('[update]', e); }
    location.replace(location.pathname + '?v=' + Date.now());
  }

  document.getElementById('ge-update-now').addEventListener('click', function () {
    this.textContent = 'Atualizando';
    this.disabled = true;
    aplicar();
  });
  document.getElementById('ge-update-later').addEventListener('click', function () {
    toast.classList.remove('show');
    toast.setAttribute('aria-hidden', 'true');
  });

  // Consulta a versão publicada. no-store: nunca pode vir do cache.
  async function checar(porClique) {
    if (aplicando) return;
    if (porClique && pill.dataset.state !== 'stale') pill.dataset.state = 'checking';
    var servidor = null;
    try {
      var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { var j = await r.json(); servidor = j && j.version; }
    } catch (e) {}

    // Em paralelo, deixa o navegador reavaliar o sw.js (cobre o caso de o
    // version.json não ter sido bumpado por esquecimento).
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg) { await reg.update(); if (reg.waiting) return anunciar(servidor); }
      }
    } catch (e) {}

    if (servidor && servidor !== APP_VERSION) return anunciar(servidor);

    if (porClique) {
      pill.dataset.state = 'current';
      label.textContent = 'v' + APP_VERSION + ' · atualizado';
      setTimeout(function () {
        if (pill.dataset.state === 'stale') return;
        pill.dataset.state = 'idle';
        label.textContent = 'v' + APP_VERSION;
      }, 2600);
    }
  }

  pill.addEventListener('click', function () { checar(true); });
  pill.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); checar(true); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
  // Verifica ao abrir, a cada 10 min e sempre que a aba volta ao foco.
  checar(false);
  setInterval(function () { checar(false); }, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checar(false);
  });

  // ==========================================================================
  // INSTALAÇÃO NATIVA
  // beforeinstallprompt dispara MUITO cedo — precisa ser capturado aqui, antes
  // do React montar, senão o evento se perde e o botão nunca funciona.
  // ==========================================================================
  window.__gePrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gePrompt = e;
    window.dispatchEvent(new CustomEvent('ge-instalavel'));
  });
  window.addEventListener('appinstalled', function () {
    window.__gePrompt = null;
    window.dispatchEvent(new CustomEvent('ge-instalado'));
  });
})();
</script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
<script src="js/modais.js"></script>
<script src="js/card-modal.js"></script>
<script src="js/kanban.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/history.js"></script>
<script src="js/users.js"></script>
<script src="js/calendar.js"></script>
<script src="js/timeline.js"></script>
<script src="js/livro.js"></script>
<script src="js/acoes.js"></script>
<script src="js/floating.js"></script>
<script src="js/app.js"></script>

</body>
</html>
